name: Build personal APK
# Builds "HeliBoard+" (GIF picker etc.), signed with the key from repository secrets,
# and publishes the APK as a GitHub release so it can be downloaded directly on the phone.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   KLIPY_API_KEY             - KLIPY API key for the GIF picker
#   SIGNING_KEYSTORE_BASE64   - base64 of the release keystore (optional, without it every build needs a reinstall)
#   SIGNING_PASSWORD          - password of keystore and key

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-personal.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret, using a temporary debug key"
            exit 0
          fi
          # tolerate spaces / line breaks from copy-pasting
          PW=$(printf %s "$SIGNING_PASSWORD" | tr -d ' \r\n')
          if ! printf %s "$SIGNING_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/personal.jks" 2>/dev/null; then
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not valid base64 (copied incompletely?), using a temporary debug key"
            exit 0
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/personal.jks" -storetype PKCS12 -storepass "$PW" -alias personal > /dev/null 2>&1; then
            echo "::warning::Keystore can't be opened with SIGNING_PASSWORD, check both secrets. Using a temporary debug key"
            exit 0
          fi
          echo "Signing key OK"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/personal.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$PW"
          echo "SIGNING_STORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Build
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          SIGNING_KEY_ALIAS: personal
        run: |
          if [ -z "$KLIPY_API_KEY" ]; then echo "::warning::No KLIPY_API_KEY secret, GIF picker will not work"; fi
          export KLIPY_API_KEY=$(printf %s "$KLIPY_API_KEY" | tr -d ' \r\n"\\')
          chmod +x gradlew
          set +e
          ./gradlew assemblePersonal 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # show the reason as annotations, they are visible without opening the logs
            grep -A12 "What went wrong" "$RUNNER_TEMP/build.log" | grep -v '^\s*$' | head -9 | sed 's/^/::error::/'
            grep -m5 "^e: " "$RUNNER_TEMP/build.log" | sed 's/^/::error::/'
          fi
          exit $status

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-personal
          path: app/build/outputs/apk/personal/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HeliBoard+ build ${{ github.run_number }}
          body: Built from ${{ github.sha }}
          files: app/build/outputs/apk/personal/*.apk

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
