name: Build personal APK
# Builds "HeliBoard+" (GIF picker etc.), signed with the key from repository secrets,
# and publishes the APK as a GitHub release so it can be downloaded directly on the phone.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   KLIPY_API_KEY             - KLIPY API key for the GIF picker
#   SIGNING_KEYSTORE_BASE64   - base64 of the release keystore (optional, without it every build needs a reinstall)
#   SIGNING_PASSWORD          - password of keystore and key

on:
  workflow_dispatch:
  push:
    branches: [ main, gif-panel ]
    paths:
      - 'app/**'
      - '.github/workflows/build-personal.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/personal.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/personal.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret, using a temporary debug key"
          fi

      - name: Build
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: personal
        run: |
          if [ -z "$KLIPY_API_KEY" ]; then echo "::warning::No KLIPY_API_KEY secret, GIF picker will not work"; fi
          chmod +x gradlew
          ./gradlew assemblePersonal

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-personal
          path: app/build/outputs/apk/personal/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HeliBoard+ build ${{ github.run_number }}
          body: Built from ${{ github.sha }}
          files: app/build/outputs/apk/personal/*.apk

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
